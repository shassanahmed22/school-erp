version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: school_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_erp_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/school_erp?schema=public"
      JWT_ACCESS_SECRET: "change-this-access-secret-in-production"
      JWT_REFRESH_SECRET: "change-this-refresh-secret-in-production"
      NODE_ENV: production
      COOKIE_SECURE: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
